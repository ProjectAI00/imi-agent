[package]
name = "imi"
version = "0.3.20"
edition = "2021"

[[bin]]
name = "imi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
notify = "6.1.1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
